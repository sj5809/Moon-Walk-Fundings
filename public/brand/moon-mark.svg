<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">
  <!-- Brand mark: moon behind a house roof, rocket trailing a blue swoosh. Tuned for dark backgrounds. -->
  <defs>
    <radialGradient id="moon" cx=".62" cy=".38" r=".75">
      <stop offset="0" stop-color="#f4f6fa"/><stop offset=".6" stop-color="#b9c1ce"/><stop offset="1" stop-color="#6f7a8c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e90ff" stop-opacity=".95"/><stop offset=".45" stop-color="#1e90ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1e90ff" stop-opacity="0"/><stop offset=".35" stop-color="#1e90ff"/><stop offset="1" stop-color="#00bfff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset=".62" stop-color="#fff"/><stop offset=".9" stop-color="#000"/></linearGradient>
    <mask id="sky"><rect width="160" height="100" fill="url(#fade)"/></mask>
  </defs>

  <g mask="url(#sky)">
    <circle cx="72" cy="50" r="41" fill="#1e90ff" opacity=".45" filter="url(#glow)"/>
    <circle cx="72" cy="50" r="40" fill="url(#moon)"/>
    <g fill="#5d6778" opacity=".22">
      <circle cx="60" cy="30" r="6"/><circle cx="84" cy="24" r="3"/><circle cx="52" cy="56" r="4"/>
      <circle cx="92" cy="44" r="8"/><circle cx="74" cy="40" r="2.5"/><circle cx="44" cy="40" r="2.5"/>
      <circle cx="66" cy="18" r="2"/><circle cx="100" cy="30" r="2.5"/><circle cx="36" cy="54" r="2"/>
    </g>
    <circle cx="72" cy="50" r="40" fill="url(#rim)"/>
  </g>

  <path d="M14 90C58 84 104 62 130 30 106 66 64 86 14 90Z" fill="url(#swoosh)"/>
  <path d="M30 94C74 90 112 70 134 40 114 74 76 92 30 94Z" fill="url(#swoosh)" opacity=".55"/>

  <rect x="103" y="60" width="9" height="18" fill="#0b1224" stroke="#e9edf5" stroke-width="1.6"/>
  <path d="M38 94 84 54l46 40h-12L84 64 50 94Z" fill="#0b1224" stroke="#e9edf5" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="#f4f6fa"><rect x="78.5" y="71" width="5" height="5"/><rect x="84.5" y="71" width="5" height="5"/><rect x="78.5" y="77" width="5" height="5"/><rect x="84.5" y="77" width="5" height="5"/></g>

  <g transform="translate(136 24) rotate(45)">
    <path d="M-2.5 9 0 17 2.5 9Z" fill="#00bfff"/>
    <path d="M-4.5 3-9 11-4.5 9ZM4.5 3 9 11 4.5 9Z" fill="#1e90ff"/>
    <path d="M0-15C5.5-9 5.5 4 4.5 9h-9C-5.5 4-5.5-9 0-15Z" fill="#f4f6fa"/>
    <circle cy="-4" r="2.3" fill="#1e90ff"/>
  </g>
</svg>
